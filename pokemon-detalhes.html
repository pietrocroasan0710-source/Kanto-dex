"151":[{lvl:1,nome:"Pound",tipo:"normal"},{lvl:10,nome:"Transform",tipo:"normal"},{lvl:20,nome:"Mega Punch",tipo:"normal"},{lvl:30,nome:"Metronome",tipo:"normal"},{lvl:40,nome:"Psychic",tipo:"psiquico"},{lvl:50,nome:"Ancient Power",tipo:"pedra"}]
};

    const ROTULO_TIPO = {
      normal:"Normal", fogo:"Fogo", agua:"Água", eletrico:"Elétrico", grama:"Grama",
      gelo:"Gelo", lutador:"Lutador", veneno:"Veneno", terra:"Terra", voador:"Voador",
      psiquico:"Psíquico", inseto:"Inseto", pedra:"Pedra", fantasma:"Fantasma",
      dragao:"Dragão", sombrio:"Sombrio", aco:"Aço", fada:"Fada"
    };

    function badge(tipoSlug){
      return `<span class="badge tipo-${tipoSlug}">${ROTULO_TIPO[tipoSlug] || tipoSlug}</span>`;
    }

    function barraStat(rotulo, valor, max){
      const pct = Math.min(100, Math.round((valor / max) * 100));
      return `
        <div class="linha-stat">
          <span class="linha-stat-nome">${rotulo}</span>
          <div class="linha-stat-barra"><div class="linha-stat-preenchimento" style="width:${pct}%"></div></div>
          <span class="linha-stat-valor">${valor}</span>
        </div>`;
    }

    function pad3(n){ return String(n).padStart(3, '0'); }

    function montarEvolucao(cadeia, numAtual){
      if (cadeia.length < 2){
        return '<p class="sub">Este Pokémon não evolui.</p>';
      }
      return '<div class="cadeia-evolucao">' + cadeia.map((n, i) => {
        const p = DADOS[n];
        if (!p) return '';
        const atual = n === numAtual ? ' atual' : '';
        const seta = i < cadeia.length - 1 ? '<span class="seta-evolucao">→</span>' : '';
        return `<a class="evo-item${atual}" href="pokemon-detalhes.html?n=${n}">
                  <span class="num">#${n}</span>
                  <img src="${p.img}" alt="${p.nome}" loading="lazy">
                  <span class="evo-nome">${p.nome}</span>
                </a>${seta}`;
      }).join('') + '</div>';
    }

    function montarGolpesNivel(numero){
      const lista = GOLPES_NIVEL[numero];
      if (!lista || lista.length === 0){
        return '<p class="sub">Nenhum golpe de nível cadastrado para este Pokémon.</p>';
      }
      const linhas = lista.map(g => `
        <tr>
          <td class="mono">${g.lvl === 1 ? 'Inicial' : 'Nv. ' + g.lvl}</td>
          <td>${g.nome}</td>
          <td>${badge(g.tipo)}</td>
        </tr>`).join('');
      return `
        <div class="wrap-tabela">
          <table>
            <thead><tr><th>Nível</th><th>Golpe</th><th>Tipo</th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
        <p class="sub" style="margin-top:8px; font-size:13px;">
          Moveset de referência: Pokémon FireRed / LeafGreen.
        </p>`;
    }

    function montarGolpesTM(tipos){
      const compativeis = TMS.filter(t => tipos.includes(t.tipo));
      if (compativeis.length === 0){
        return '<p class="sub">Nenhuma TM do tipo deste Pokémon na nossa lista — confira a <a href="tms.html">tabela completa de TMs</a>.</p>';
      }
      const itens = compativeis.map(t => `
        <li class="golpe-item">
          <span class="golpe-tm">${t.tm}</span>
          <span class="golpe-nome">${t.nome}</span>
          ${badge(t.tipo)}
        </li>`).join('');
      return `<ul class="lista-golpes">${itens}</ul>
        <p class="sub" style="margin-top:10px; font-size:13px;">
          * Estimativa por compatibilidade de tipo. Veja a <a href="tms.html">lista completa de TMs</a> para todos os detalhes.
        </p>`;
    }

    function renderizar(numero){
      const p = DADOS[numero];
      const container = document.getElementById('conteudoFicha');

      if (!p){
        container.innerHTML = `
          <p class="eyebrow">Ops</p>
          <h1>Pokémon não encontrado</h1>
          <p class="sub">Não achamos o número <strong>${numero}</strong> na Kantodex.
          Volte para a <a href="pokemons.html">Pokédex completa</a>.</p>`;
        return;
      }

      document.getElementById('tituloPagina').textContent = `${p.nome} — Kantodex`;

      const badgesTipos = p.tipos.map(badge).join(' ');
      const badgesFraquezas = p.fracas.length ? p.fracas.map(badge).join(' ') : '<span class="sub">Nenhuma</span>';
      const badgesResistencias = p.resiste.length ? p.resiste.map(badge).join(' ') : '<span class="sub">Nenhuma</span>';
      const badgesImunidades = p.imune.length ? p.imune.map(badge).join(' ') : '<span class="sub">Nenhuma</span>';

      const numAnterior = pad3(((parseInt(numero,10) + 149) % 151) + 1);
      const numProximo   = pad3((parseInt(numero,10) % 151) + 1);

      container.innerHTML = `
        <p class="eyebrow">Pokédex Nacional · Kanto</p>
        <div class="ficha-cabecalho">
          <img class="ficha-imagem" src="${p.img}" alt="${p.nome}">
          <div>
            <span class="num-grande">#${numero}</span>
            <h1>${p.nome}</h1>
            <p class="badges">${badgesTipos}</p>
            <p class="sub">${p.desc}</p>
          </div>
        </div>

        <div class="nav-ficha">
          <a href="pokemon-detalhes.html?n=${numAnterior}">← Anterior (#${numAnterior})</a>
          <a href="pokemons.html">Ver Pokédex completa</a>
          <a href="pokemon-detalhes.html?n=${numProximo}">Próximo (#${numProximo}) →</a>
        </div>

        <h2>Estatísticas base</h2>
        <div class="bloco-stats">
          ${barraStat('HP', p.hp, 255)}
          ${barraStat('Ataque', p.atk, 200)}
          ${barraStat('Defesa', p.def, 230)}
          ${barraStat('Especial', p.esp, 200)}
          ${barraStat('Velocidade', p.spd, 180)}
        </div>
        <p class="sub" style="margin-top:8px;">Total base: <strong>${p.total}</strong></p>

        <h2>Fraquezas e resistências</h2>
        <div class="grade-tipos">
          <div><p class="rotulo-mini">🔺 Fraco contra</p><p>${badgesFraquezas}</p></div>
          <div><p class="rotulo-mini">🛡️ Resiste a</p><p>${badgesResistencias}</p></div>
          <div><p class="rotulo-mini">🚫 Imune a</p><p>${badgesImunidades}</p></div>
        </div>

        <h2>Linha evolutiva</h2>
        ${montarEvolucao(p.cadeia, numero)}

        <h2>Golpes aprendidos por nível</h2>
        ${montarGolpesNivel(numero)}

        <h2>Golpes compatíveis (TMs)</h2>
        ${montarGolpesTM(p.tipos)}
      `;
    }

    const parametros = new URLSearchParams(window.location.search);
    const numeroPedido = pad3(parseInt(parametros.get('n') || '1', 10) || 1);
    renderizar(numeroPedido);

    const botaoTopo = document.getElementById('botaoTopo');
    window.addEventListener('scroll', () => {
      botaoTopo.classList.toggle('visivel', window.scrollY > 400);
    });
    botaoTopo.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
